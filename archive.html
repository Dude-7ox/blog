<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архив · Мой блог</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            background: #100600;
            color: #ff9500;
            font-family: "Courier New", monospace;
            min-height: 100%;
            margin: 0;
        }
        body {
            padding: 20px;
            position: relative;
            text-shadow: 0 0 6px rgba(255,149,0,0.75), 0 0 12px rgba(255,120,0,0.35);
        }
        body::before {
            content: "";
            position: fixed; inset: 0;
            background:
                repeating-linear-gradient(0deg, rgba(255,149,0,0.06) 0 1px, transparent 1px 3px),
                radial-gradient(ellipse at center, rgba(255,149,0,0.05), transparent 70%);
            pointer-events: none;
            z-index: 1000;
            animation: flicker 4s infinite;
        }
        body::after {
            content: "";
            position: fixed; inset: 0;
            box-shadow: inset 0 0 200px 40px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 999;
        }
        @keyframes flicker {
            0%,100% { opacity: 1; }
            92% { opacity: 1; }
            93% { opacity: 0.85; }
            94% { opacity: 1; }
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255,149,0,0.03);
            border: 1px solid #ff9500;
            box-shadow: 0 0 30px rgba(255,149,0,0.18) inset, 0 0 40px rgba(255,149,0,0.08);
            position: relative;
            z-index: 1;
        }
        .header {
            padding: 34px 30px 26px;
            text-align: center;
            border-bottom: 1px dashed #ff9500;
        }
        .header h1 {
            margin: 0 0 12px 0;
            font-size: 22px;
            letter-spacing: 5px;
            font-weight: normal;
            text-transform: uppercase;
        }
        .header p {
            margin: 0;
            font-size: 11px;
            letter-spacing: 3px;
            opacity: 0.7;
            text-transform: uppercase;
        }
        .nav {
            display: flex;
            justify-content: center;
            gap: 26px;
            padding: 14px 20px;
            border-bottom: 1px dashed rgba(255,149,0,0.55);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .nav a {
            color: #ff9500;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.15s, opacity 0.15s;
        }
        .nav a:hover, .nav a.active {
            border-bottom-color: #ff9500;
            opacity: 0.85;
        }
        .content {
            padding: 30px;
        }
        .archive-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .archive-list li {
            border-bottom: 1px dashed rgba(255,149,0,0.35);
            padding: 14px 4px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 16px;
            font-size: 13px;
            letter-spacing: 1px;
        }
        .archive-list li:last-child {
            border-bottom: none;
        }
        .archive-list a {
            color: #ff9500;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.15s;
        }
        .archive-list a:hover {
            border-bottom-color: #ff9500;
        }
        .archive-list .date {
            font-size: 11px;
            opacity: 0.6;
            white-space: nowrap;
        }
        .footer {
            padding: 22px 30px;
            border-top: 1px dashed #ff9500;
            text-align: center;
            font-size: 10px;
            letter-spacing: 2px;
            opacity: 0.65;
            text-transform: uppercase;
        }
        ::selection {
            background: #ff9500;
            color: #100600;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .header { padding: 26px 18px 20px; }
            .header h1 { font-size: 16px; letter-spacing: 3px; }
            .nav { gap: 16px; font-size: 10px; flex-wrap: wrap; }
            .content { padding: 20px 16px; }
            .archive-list li { flex-direction: column; gap: 4px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>▓▒░ МОЙ БЛОГ ░▒▓</h1>
            <p>ТЕКСТ · МЫСЛИ · ЗАМЕТКИ</p>
        </div>
        <nav class="nav">
            <a href="index.html">Главная</a>
            <a href="about.html">О себе</a>
            <a href="archive.html" class="active">Архив</a>
        </nav>
        <div class="content">
            <h2 style="font-size:11px;letter-spacing:4px;text-transform:uppercase;opacity:.85;margin:0 0 18px 0;padding-bottom:8px;border-bottom:1px dashed rgba(255,149,0,0.4);font-weight:normal;">▎ВСЕ ЗАПИСИ</h2>

            <ul class="archive-list">
                <li>
                    <a href="post2.html">Заголовок второй статьи</a>
                    <span class="date">2026-10-02</span>
                </li>
                <li>
                    <a href="post1.html">Заголовок первой статьи</a>
                    <span class="date">2026-10-01</span>
                </li>
            </ul>
        </div>
        <div class="footer">
            © 2026 · Dude7ox · СДЕЛАНО ВРУЧНУЮ
        </div>
    </div>
</body>
</html>
